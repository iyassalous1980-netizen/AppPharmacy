<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدلية البلد - نظام الحضور والكاش</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #0f766e;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
        }

        .header h2 { margin: 0; color: var(--primary); font-size: 1.4rem; font-weight: 700; }
        .header p { margin: 5px 0 0; color: #64748b; font-size: 0.85rem; }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #334155; }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #f8fafc;
            font-size: 0.95rem;
            color: var(--text);
            transition: all 0.2s;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn:hover { background-color: #0d9488; }
        .btn:active { transform: scale(0.98); }

        .status-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
        }

        .status-box.success { background-color: #dcfce7; color: #15803d; display: block; }
        .status-box.error { background-color: #fee2e2; color: #b91c1c; display: block; }

        .history-section { margin-top: 25px; border-top: 1px solid var(--border); padding-top: 15px; }
        .history-section h3 { font-size: 1rem; color: var(--primary); margin-bottom: 10px; text-align: right; }

        .table-container { overflow-x: auto; max-height: 250px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: right; }
        th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
        th { background-color: #f1f5f9; color: #475569; position: sticky; top: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏥 صيدلية البلد</h2>
        <p>نظام الحضور والغياب وحركة الكاش</p>
    </div>

    <form id="attendanceForm">
        <div class="form-group">
            <label for="employee">الموظف:</label>
            <select id="employee" required>
                <option value="" disabled selected>اختر الموظف...</option>
                <option value="خليل">خليل</option>
                <option value="أسيل 2">أسيل 2</option>
                <option value="أسيل نصيف">أسيل نصيف</option>
                <option value="د. إياس">د. إياس</option>
            </select>
        </div>

        <div class="form-group">
            <label for="action">الإجراء:</label>
            <select id="action" required>
                <option value="" disabled selected>اختر الإجراء...</option>
                <option value="تسجيل دخول بداية الدوام">تسجيل دخول (بداية الدوام)</option>
                <option value="تسجيل خروج نهاية الدوام">تسجيل خروج (نهاية الدوام)</option>
                <option value="تحديث الكاش">تحديث / استلام الكاش</option>
                <option value="إغلاق الكاش النهائي">إغلاق الكاش النهائي</option>
            </select>
        </div>

        <div class="form-group">
            <label for="cashAmount">مبلغ الكاش (شيكل):</label>
            <input type="number" id="cashAmount" placeholder="0" step="any" value="0">
        </div>

        <div class="form-group">
            <label for="notes">ملاحظات:</label>
            <input type="text" id="notes" placeholder="أدخل أي ملاحظات إضافية...">
        </div>

        <button type="submit" class="btn" id="submitBtn">تسجيل البيانات</button>
    </form>

    <div id="statusBox" class="status-box"></div>

    <div class="history-section">
        <h3>📊 السجل المباشر للمزامنة</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>الوقت</th>
                        <th>الموظف</th>
                        <th>الإجراء</th>
                        <th>الكاش</th>
                    </tr>
                </thead>
                <tbody id="logsTable">
                    <tr><td colspan="4" style="text-align:center;">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>

<script>
    // رابط API الخاص بجداول البيانات لحفظ الحضور والكاش
    const API_URL = "https://script.google.com/macros/s/AKfycbzSqK-FcXqvX2qh8jfVTQQgzEiSeF7ntnnFX2abIJBpMZ5yWjH1bvqINe0tyqVhfjiXww/exec";

    const form = document.getElementById('attendanceForm');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');
    const logsTable = document.getElementById('logsTable');

    document.addEventListener('click', function() {
        const audio = document.getElementById('alarmSound');
        audio.play().then(() => audio.pause()).catch(()=>{});
    }, { once: true });

    function triggerAlarm() {
        const audio = document.getElementById('alarmSound');
        audio.play().catch(e => console.log("Audio block"));
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const employee = document.getElementById('employee').value;
        const action = document.getElementById('action').value;
        const cashAmount = document.getElementById('cashAmount').value;
        const notes = document.getElementById('notes').value;

        submitBtn.disabled = true;
        submitBtn.innerText = "جاري الإرسال...";
        statusBox.className = 'status-box';
        statusBox.style.display = 'none';

        try {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ employee, action, cashAmount, notes })
            });

            statusBox.className = 'status-box success';
            statusBox.innerText = 'تم التسجيل والمزامنة بنجاح! 🟢';
            triggerAlarm();
            form.reset();
            document.getElementById('cashAmount').value = "0";
            setTimeout(loadLogs, 1500);

        } catch (error) {
            statusBox.className = 'status-box error';
            statusBox.innerText = 'حدث خطأ أثناء الإرسال!';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "تسجيل البيانات";
        }
    });

    async function loadLogs() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            let html = "";
            for (let i = data.length - 1; i >= 1; i--) {
                const date = new Date(data[i][0]).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                html += `<tr>
                    <td>${date}</td>
                    <td>${data[i][1]}</td>
                    <td>${data[i][2]}</td>
                    <td>${data[i][3]} شيكل</td>
                </tr>`;
            }
            logsTable.innerHTML = html || "<tr><td colspan='4' style='text-align:center;'>لا توجد سجلات بعد</td></tr>";
        } catch (err) {
            logsTable.innerHTML = "<tr><td colspan='4' style='text-align:center;'>جاري إعادة الاتصال...</td></tr>";
        }
    }

    setInterval(loadLogs, 5000);
    loadLogs();
</script>

</body>
</html>
